# Capabilites
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g focus-events on
set -g mouse on

# Preferences
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on


# Statusline
set -g status-interval 5
set -g status-position top
set -g status-style bg=default
set -g status-left-length 50
set -g status-left "#[fg=colour240]#(whoami)@#H:#[fg=colour15]#S #{?client_prefix,#[fg=colour201]##,#[fg=colour46]$} #[default]"
set -g window-status-format "#W -#I"
set -g window-status-current-format "#[fg=colour39]#W -#I#[default]"
set -g window-status-separator "#[fg=colour240] | "
set -g status-right-length 100
set -g status-right '#(cd #{pane_current_path} && git rev-parse --git-dir >/dev/null 2>&1 && if [ -n "#{git_status_script}" ] && [ -f "#{git_status_script}" ]; then git status --porcelain=v1 -b 2>/dev/null | awk -f "#{git_status_script}"; else echo -n "#[fg=colour39]"; git branch --show-current 2>/dev/null | tr -d "\\n"; echo -n "#[fg=default]"; git diff --quiet || echo -n "*"; echo; fi)'

# Keymaps
bind F5 source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf sourced"
bind -r i last # leave l for vim pane motions
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Sensible defaults
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind \; command-prompt
bind c neww -c "#{pane_current_path}"
bind C-c neww -c "#{pane_current_path}"
bind '"' splitw -c "#{pane_current_path}"
bind % splitw -h -c "#{pane_current_path}"

# Hold control same as no hold
bind -r C-n next
bind -r C-p prev
bind -r C-i last
bind C-w choose-window
bind C-s choose-session
bind C-x killp
bind C-z resizep -Z
bind C-[ copy-mode
bind C-] paste-buffer
bind C-f command-prompt "find-window '%%'"
bind C-t clock-mode
bind "C-?" list-keys
bind -r C-Space nextl
bind "C-:" command-prompt
bind C-q displayp
bind C-r refresh-client
bind "C-!" breakp
bind C-m selectp -m

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'

setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
run '#{TMUX_PLUGIN_MANAGER_PATH}tpm/tpm'
