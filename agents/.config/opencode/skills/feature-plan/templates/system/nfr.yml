# Non-Functional Requirements
# This file defines enforceable system-wide constraints

performance:
  response_time_ms: 200
  max_db_calls_per_request: 10
  forbid_n_plus_one_queries: true

security:
  auth_required: true
  input_validation: strict
  forbid_sensitive_data_exposure: true
  prevent_injection: true

reliability:
  uptime: 99.9%
  require_error_handling: true
  require_retries: true
  forbid_silent_failures: true

scalability:
  forbid_unbounded_loops: true
  avoid_blocking_operations: true
  require_async_when_possible: true

maintainability:
  max_function_length: 40
  max_file_length: 300
  max_cyclomatic_complexity: 10

  duplication:
    max_similarity_percent: 20

  structure:
    enforce_layering: true
    forbid_god_objects: true

  naming:
    require_descriptive_names: true
    forbid_generic_names: true

  tests:
    require_test_per_behavior: true

  comments:
    forbid_redundant_comments: true
    require_explanation_for_complex_logic: true
